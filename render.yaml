services:
  - type: web
    name: lowes-pdp-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PHONE_RELAY_ENABLED
        value: "true"
      - key: PHONE_RELAY_MAX_STREAMS_PER_PHONE
        value: "1"
      - key: PHONE_RELAY_TOKEN
        sync: false
    healthCheckPath: /health
